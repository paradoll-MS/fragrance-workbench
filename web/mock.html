<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟中台</title><link rel="stylesheet" href="/style.css"><script src="/mock.js" defer></script></head>
<body>
  <header class="topbar"><a class="wordmark" href="/mock-platform"><span class="mark mark-blue">中</span> 模拟中台</a><nav><a href="/projects">项目流程</a><a href="/">选香</a><a aria-current="page" href="/mock-platform">模拟中台</a></nav></header>
  <main class="workspace">
    <div class="page-title"><div><h1>模拟中台</h1><p id="summary">部门任务、数据回流与模拟报价</p></div><button id="refresh">刷新</button></div>
    <nav class="subnav" aria-label="中台功能"><a href="#department-board">部门与回流</a><a href="#catalog-lab">香精库与权重</a><a href="#dictionaries">字典</a></nav>
    <div class="mockgrid" id="department-board">
      <section class="panel">
        <div class="section-line"><h2>部门任务</h2><button id="pass-all" class="primary">待处理全部通过</button></div>
        <label for="department">部门</label><select id="department"><option value="">全部部门</option></select>
        <label for="mock-default">新任务回执</label><select id="mock-default" disabled><option value="">手动回执</option><option value="1">自动通过</option><option value="0">自动退回</option></select>
        <div id="tasks" class="task-list"></div>
      </section>
      <aside class="stack">
        <section class="panel"><h2>模拟报价</h2><form id="quote-form"><label for="code">香精编号</label><input id="code" required><label for="price">元/kg</label><input type="number" id="price" min="0.01" step="any" placeholder="留空恢复库价"><button class="primary">保存报价</button></form><p class="muted small" id="quotes"></p></section>
        <section class="panel"><h2>数据回流</h2><div id="feed" class="task-list"></div></section>
      </aside>
    </div>
    <div class="mockgrid labgrid">
      <section class="panel" id="catalog-lab">
        <h2>香精库与权重</h2>
        <form id="lab-form">
          <label for="lab-mode">试算模式</label><select id="lab-mode"><option value="recommend_simple">常规推荐</option><option value="recommend_brand">品牌推荐</option><option value="with_sample">对香</option></select>
          <div class="lab-fields">
            <label>香精名称或编号<input id="lab-term"></label>
            <label>应用品类<select id="lab-category"><option value="">全部品类</option></select></label>
            <label>价格上限<input type="number" id="lab-price" min="0.01" step="any" placeholder="元/kg"></label>
          </div>
          <label for="lab-tag-search">查找标签名称或编号</label><input id="lab-tag-search" type="search">
          <div class="lab-fields"><label>正向偏好<select id="lab-positive" multiple size="4"></select></label><label>负向扣分<select id="lab-negative" multiple size="4"></select></label><label>排序<select id="lab-sort"><option value="match">匹配分</option><option value="price_asc">价格升序</option><option value="price_desc">价格降序</option></select></label></div>
          <div class="weights" id="lab-weights"></div>
          <button class="primary" type="submit">试算排序</button>
        </form>
        <p id="lab-note" role="status" class="muted"></p>
        <div id="lab-results" class="task-list"></div>
      </section>
      <section class="panel" id="dictionaries">
        <h2>字典</h2>
        <label for="dictionary-mode">字典类型</label>
        <select id="dictionary-mode"><option value="terms">ABC 标签</option><option value="links">C → AB 关联</option><option value="categories">应用品类</option><option value="review_categories">审查品类</option><option value="metrics">审查指标</option><option value="products">品牌产品</option></select>
        <label for="dictionary-search">名称或编号</label><input id="dictionary-search">
        <p id="dictionary-count" class="muted small"></p>
        <div id="dictionary-items" class="task-list"></div>
      </section>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
