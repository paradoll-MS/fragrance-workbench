<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>评香工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/workbench.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="wordmark" href="/projects"><span class="mark">香</span> 评香工作台</a><nav><a href="/projects">项目流程</a><a aria-current="page" href="/">选香</a><a href="/mock-platform">模拟中台</a></nav></header>
  <main class="workspace">
    <div class="page-title"><div><h1>选香</h1><p id="catalog-meta"></p></div><div class="project-actions"><label class="sr-only" for="project">当前项目</label><select id="project"><option value="">浏览模式</option></select><button id="new-project">新建项目</button></div></div>
    <p id="flow-banner" class="notice" hidden></p>
    <div class="workgrid">
      <aside class="panel filters" aria-labelledby="filters-title">
        <h2 id="filters-title">检索条件</h2>
        <label for="mode">模式</label>
        <select id="mode"><option value="recommend_simple">常规推荐</option><option value="recommend_brand">品牌推荐</option><option value="with_sample">对香</option><option value="find_product">精确找香</option></select>
        <label for="asset-search">香精名称或编号</label><input id="asset-search" type="search">
        <label for="categories">应用品类</label>
        <select id="categories" multiple size="4"></select>
        <label class="check"><input type="checkbox" id="confirmed-only"> 仅已确认品类</label>
        <div class="three">
          <label>最低价<input id="min-price" type="number" min="0.01" step="any" placeholder="元/kg"></label>
          <label>最高价<input id="max-price" type="number" min="0.01" step="any" placeholder="元/kg"></label>
          <label>参考价<input id="target-price" type="number" min="0.01" step="any" placeholder="元/kg"></label>
        </div>
        <div id="directory-controls">
          <label for="big-brand">大牌仿香</label>
          <select id="big-brand"><option value="all">全部</option><option value="confirmed">仅已确认与人工标记</option><option value="include_suggested">包含高可信候选</option></select>
          <label for="brand">品牌</label>
          <select id="brand"><option value="">全部品牌</option></select>
          <div class="row"><label class="check"><input id="only-new" type="checkbox"> 新品</label><label class="check"><input id="only-hot" type="checkbox"> 爆品</label></div>
        </div>
        <div id="sample-controls" hidden>
          <label for="sample">实物描述 / 样品号</label><input id="sample">
          <label for="similarity">相似度要求</label><select id="similarity"><option value="">待定</option><option>接近即可</option><option>尽量一致</option></select>
          <button id="direct-develop" class="quiet full">直接开发</button>
        </div>
      </aside>
      <section class="main-column">
        <section id="brief-panel" class="panel targeting">
          <div class="section-line"><h2>香气需求</h2><button class="quiet" id="mapping">提取标签</button></div>
          <label class="sr-only" for="brief">香气需求</label>
          <textarea id="brief" rows="2" placeholder="例如 清新的木质香，避免太甜"></textarea>
          <div id="mapping-note" class="small muted" aria-live="polite"></div>
          <div id="demand-summary" class="demand-summary" hidden></div>
          <details id="demand-editor" class="demand-editor">
            <summary>编辑需求标签</summary>
            <div class="row demand-add">
              <label class="sr-only" for="demand-search">查找需求标签</label><input id="demand-search" type="search" placeholder="输入香气词或标签名称">
              <label class="sr-only" for="demand-role">标签用途</label><select id="demand-role"><option value="preference">偏好</option><option value="required">必须</option><option value="avoid">避开（扣分）</option></select>
            </div>
            <div id="demand-options" class="picker"></div>
            <details id="combination-editor">
              <summary>组合条件</summary>
              <div id="groups" class="groups"></div>
              <button id="add-combination" type="button" class="quiet">添加组合条件</button>
            </details>
          </details>
        </section>
        <section id="exact-panel" class="panel targeting" hidden>
          <h2>产品身份</h2><label for="product">目录产品</label><select id="product"></select>
          <label for="edition">版本（可空）</label><input id="edition" placeholder="例如 EDT">
        </section>
        <section class="panel results">
          <div class="section-line"><div><h2>候选香精</h2><p id="result-count" class="muted small"></p></div><div class="row">
            <label class="sr-only" for="sort">排序</label>
            <select id="sort"><option value="match">匹配分优先</option><option value="price_asc">价格升序</option><option value="price_desc">价格降序</option><option value="price_target">接近参考价</option><option value="new">新品优先</option><option value="hot">爆品优先</option></select>
            <button class="primary" id="search">查找香精</button></div></div>
          <p class="notice" id="diagnostics" hidden></p>
          <p id="status" role="status" class="muted"></p>
          <div id="result-list" class="result-list"></div>
          <div class="row" id="pagination" hidden><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button></div>
          <details id="alternatives" hidden><summary id="alternative-title">条件外候选</summary><div id="alternative-list" class="result-list"></div></details>
          <details id="unmatched" hidden><summary id="unmatched-title"></summary><div id="unmatched-list" class="result-list"></div></details>
        </section>
        <section class="panel" id="project-progress" hidden><div class="section-line"><h2>项目进度</h2><button id="refresh-progress" class="quiet">刷新</button></div><div id="progress-list"></div></section>
      </section>
    </div>
  </main>
  <dialog id="edit-dialog"><form id="edit-form"><div class="section-line"><h2 id="edit-title"></h2><button type="button" data-close="edit-dialog" class="quiet">关闭</button></div><label for="asset-name">名称</label><input id="asset-name"><label for="asset-tag-search">查找标签</label><input id="asset-tag-search" placeholder="按名称或编号搜索"><div id="asset-tags" class="picker"></div><div id="asset-chips" class="chips"></div><label for="asset-product">大牌仿香产品名</label><select id="asset-product"></select><div id="asset-products" class="chips"></div><button class="primary" type="submit">保存标签</button><p id="edit-feedback" role="status"></p></form></dialog>
  <dialog id="project-dialog"><form id="project-form"><div class="section-line"><h2>新建项目</h2><button type="button" data-close="project-dialog" class="quiet">关闭</button></div><label for="project-name">名称</label><input id="project-name" required><label for="project-brief">需求原文</label><textarea id="project-brief" rows="4"></textarea><button type="submit" class="primary">创建项目</button><p id="project-feedback" role="status"></p></form></dialog>
  <dialog id="action-dialog"><form id="action-form"><div class="section-line"><h2>记录处理动作</h2><button type="button" data-close="action-dialog" class="quiet">关闭</button></div><p id="action-asset"></p><label for="action-type">处理方式</label><select id="action-type"><option value="select">选定香精</option><option value="duplicate">启动仿香</option><option value="create">启动创香</option><option value="modify">基于此香修改</option><option value="checks">派发检查</option><option value="warehouse">入库</option><option value="sample">备样</option><option value="initial_shipment">初寄样</option><option value="formal_shipment">正式寄样</option></select><label for="action-note">说明</label><textarea id="action-note" rows="3"></textarea><label for="action-quantity">寄样形态和数量</label><input id="action-quantity" placeholder="例如 18% 加香小样 10 ml"><button type="submit" class="primary">保存动作</button><p id="action-feedback" role="status"></p></form></dialog>
</body>
</html>
